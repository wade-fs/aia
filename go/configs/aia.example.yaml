system:
  name: AIA
  version: "1.0"
  timezone: "Asia/Taipei"

runtime:
  data_dir: "~/.local/share/aia"
  workspace_dir: "~/.local/share/aia/workspaces"
  max_concurrent_executions: 2
  max_concurrent_per_agent: 1
  shutdown_timeout: "30s"

database:
  driver: sqlite
  path: "~/.local/share/aia/aia.db"

provider:
  default: antigravity

  antigravity:
    executable: agy
    required_version: "1.4.12"
    version_policy: minimum
    output_format: stream-json
    input_format: stream-json
    default_timeout: "30m"
    sandbox_required: true
    skip_permissions: false

memory:
  max_context_items: 20
  max_context_bytes: 24000
  auto_create_candidates: true
  auto_approve_low_risk: false

orchestrator:
  max_plan_retries: 1
  max_task_retries: 2
  max_subtasks_per_plan: 20
  max_dependency_depth: 8

logging:
  level: info
  format: json
  retain_days: 30

# Optional External Data Sources & Notification Keys (AIA-05 §6)
# Note: AI LLM uses local 'agy' CLI authentication and does NOT require any API key here.
# TWSE, TPEx, MOPS, and SEC EDGAR are public and free without API keys.
data_sources:
  fred_api_key: ""          # Optional: St. Louis Fed FRED API key (free at https://fred.stlouisfed.org)
  finmind_token: ""         # Optional: FinMind Taiwan stock history token (free tier)
  alpha_vantage_key: ""     # Optional: Alpha Vantage global market key (free tier)
  telegram_bot_token: ""    # Optional: Telegram bot token for trade proposal push alerts
  telegram_chat_id: ""      # Optional: Telegram user/group chat ID

# Domain project registrations (thinking.md §一 & §三).
# Paths support ~/  prefix and relative paths (resolved relative to this config file).
# This seeds the observer at boot; full project lifecycle is managed in SQLite via
# `aia project register --type writing --id yuan --name "元朝系列" --path novel/yuan`.
domains:
  writing:
    projects:
      - id: yuan
        name: "元朝系列小說"
        path: "novel/yuan"       # relative to this config file's directory

  coding:
    projects:
      - id: aia
        name: "AIA Core"
        path: "."                # the AIA repository itself

# Policy: file-write whitelist for the governance evaluator.
# Paths support ~/  prefix and relative paths (resolved relative to this config file).
# When empty, only /tmp and /var/tmp are permitted — no user directories are assumed.
policy:
  allowed_paths:
    - "."                        # AIA project root (relative, resolved at load time)
    - "novel"                    # novel sub-directory
    - "/tmp"
    - "/var/tmp"
